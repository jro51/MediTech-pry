spring:
  application:
    name: purchase-service
  config:
    import: "optional:configserver:http://localhost:8888"

  # Esto le dice a Spring que no falle si la BD no está disponible al arrancar
  jpa:
    # Sustituye a la propiedad 'temp' antigua
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Configuración moderna para evitar errores de metadatos en el arranque
        boot:
          allow_jdbc_metadata_access: false
  datasource:
    url: jdbc:mysql://localhost:3309/purchase_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Feign — configuración de timeouts
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
  circuitbreaker:
    enabled: false   # lo activamos cuando agreguemos Resilience4j

server:
  port: 8083