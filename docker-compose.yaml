services:
  # --- DATABASES ---
  auth-db: &db-base
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  product-db:
    <<: *db-base
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3308:3306"]

  purchase-db:
    <<: *db-base
    environment:
      MYSQL_DATABASE: purchase_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3309:3306"]

  notification-db:
    <<: *db-base
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3310:3306"]

  # --- INFRASTRUCTURE ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [ zookeeper ]
    ports: ["9092:9092"]
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CONFIG & DISCOVERY ---
  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  eureka-server:
    build: ./eureka-server
    ports: [ "8761:8761" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      config-server: { condition: service_healthy }

  # --- MICROSERVICES ---
  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    depends_on:
      config-server: {condition: service_healthy}
      eureka-server: {condition: service_healthy}
      auth-db: {condition: service_healthy}
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_db

  product-service:
    build: ./product-service
    ports: ["8082:8082"]
    depends_on:
      config-server: {condition: service_healthy}
      eureka-server: {condition: service_healthy}
      product-db: {condition: service_healthy}
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://product-db:3306/product_db

  purchase-service:
    build: ./purchase-service
    ports: [ "8083:8083" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      purchase-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://purchase-db:3306/purchase_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  notification-service:
    build: ./notification-service
    ports: ["8084:8084"]
    depends_on:
      config-server: {condition: service_healthy}
      eureka-server: {condition: service_healthy}
      kafka: {condition: service_healthy}
      notification-db: {condition: service_healthy}
    environment:
      - DB_HOST=notification-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=notification_db
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://notification-db:3306/notification_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  api-gateway:
    build: ./api-gateway
    ports: [ "8080:8080" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/