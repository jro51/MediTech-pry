spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://config-server:8888"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info